        documents: { type: integer }
        totalUsd: { type: number }
        meanUsd: { type: number }
        modelCalls: { type: integer }
    CostByCarrier:
      type: object
      required: [carrier, learnUsd, replayDocs, replayMeanUsd, replaySavingsUsd]
      properties:
        carrier: { type: string }
        learnUsd: { type: number }
        replayDocs: { type: integer }
        replayMeanUsd: { type: number }
        replaySavingsUsd: { type: number }
        breakEvenDoc: { type: integer, nullable: true }
    DocumentCostLine:
      type: object
      required: [documentId, path, costUsd, pages, modelCalls, computedAt, lines]
      properties:
        documentId: { type: string }
        carrier: { type: string, nullable: true }
        path: { type: string }
        costUsd: { type: number }
        pages: { type: integer }
        modelCalls: { type: integer }
        computedAt: { type: string, format: date-time }
        lines: { type: array, items: { $ref: '#/components/schemas/CostLine' } }
    CostReconciliation:
      type: object
      required: [meteredUsd, billedUsd, ratio, exportDate]
      properties:
        meteredUsd: { type: number }
        billedUsd: { type: number }
        ratio: { type: number }
        exportDate: { type: string, format: date, description: Last day of the reconciled period. }
        from: { type: string, format: date, nullable: true, description: First day of the reconciled period. }
        platformBilledUsd: { type: number, nullable: true, description: 'Standing platform costs billed in the period (orchestration, compute, database, storage, search): not per document.' }
        scope: { type: string, nullable: true, description: What the ratio covers and how gaps are explained (docs/evaluation/results/…-cost-reconciliation). }
    CostSummary:
      type: object
      required: [pocToDateUsd, documentsProcessed, avgCostPerDocumentUsd, zeroModelCallShare, byPath, byCarrier, documents]
      properties:
        pocToDateUsd: { type: number }
        documentsProcessed: { type: integer }
        avgCostPerDocumentUsd: { type: number }
        zeroModelCallShare: { type: number }
        byPath: { type: array, items: { $ref: '#/components/schemas/CostByPath' } }
        byCarrier: { type: array, items: { $ref: '#/components/schemas/CostByCarrier' } }
        documents: { type: array, items: { $ref: '#/components/schemas/DocumentCostLine' } }
        reconciliation: { allOf: [{ $ref: '#/components/schemas/CostReconciliation' }], nullable: true }
    FlagPushRequest:
      type: object
      properties:
        flags: { type: array, items: { type: string }, nullable: true, description: Push only these flags; all when omitted. }
        rationale: { type: string, nullable: true }
    FlagPushResult:
      type: object
      required: [quoteId, claims, flags, delivery, at]
      properties:
        quoteId: { type: string }
        claims: { type: integer }
        flags: { type: object, additionalProperties: { type: integer } }
        delivery: { type: string }
        at: { type: string, format: date-time }
    FollowUpRequest:
      type: object
      required: [assignee, action]
      properties:
        assignee: { type: string }
        action: { type: string }
        note: { type: string, nullable: true }
        claimIds: { type: array, items: { type: string }, nullable: true }
        due: { type: string, format: date, nullable: true }
    FollowUp:
      type: object
      required: [id, quoteId, assignee, action, claimIds, createdBy, createdAt]
      properties:
        id: { type: string }
        quoteId: { type: string }
        assignee: { type: string }
        action: { type: string }
        note: { type: string, nullable: true }
        claimIds: { type: array, items: { type: string } }
        due: { type: string, format: date, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    ChatTurnRequest:
      type: object
      required: [scope, question]
      properties:
        scope: { type: string, enum: [org, quote, workspace] }
        question: { type: string, maxLength: 2000 }
        quoteId: { type: string, nullable: true, description: Required when scope is quote. }
        workspaceId: { type: string, nullable: true, description: Required when scope is workspace. }
        conversationId: { type: string, nullable: true, description: Continue a conversation (same user and scope, else 409). }
    ChatCitation:
      type: object
      required: [ref, kind, label]
      properties:
        ref: { type: string, description: 'Id used inline in the text: S# (page chunk), C# (claim row), M# (metric).' }
        kind: { type: string, enum: [page, claim, metric] }
        label: { type: string }
        documentId: { type: string, nullable: true }
        page: { type: integer, nullable: true }
        sheet: { type: string, nullable: true }
        fieldPath: { type: string, nullable: true }
        claimId: { type: string, nullable: true }
        metric: { type: string, nullable: true }
        fileName: { type: string, nullable: true }
        quoteId: { type: string, nullable: true }
    ChatToolCall:
      type: object
      required: [tool, arguments, results, ms, dropped]
      properties:
        tool: { type: string, enum: [search_documents, query_claims, compute_metric] }
        arguments: { type: string, description: JSON the model passed; the scope is never among them. }
        results: { type: integer }
        ms: { type: integer, format: int64 }
        dropped: { type: integer, description: Results removed by the post-filter scope check. }
        note: { type: string, nullable: true }
    ChatTurnUsage:
      type: object
      required: [modelCalls, inputTokens, cachedInputTokens, outputTokens, embeddings, searchQueries, costUsd, firstTokenMs, totalMs, lines]
      properties:
        modelCalls: { type: integer }
        inputTokens: { type: integer, format: int64 }
        cachedInputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        embeddings: { type: integer }
        searchQueries: { type: integer }
        costUsd: { type: number }
        firstTokenMs: { type: integer, format: int64 }
        totalMs: { type: integer, format: int64 }
        lines: { type: array, items: { $ref: '#/components/schemas/CostLine' } }
    ChatTurnResult:
      type: object
      required: [turnId, conversationId, userId, role, scope, question, text, notFound, citations, toolTrace, usage, at]
      properties:
        turnId: { type: string }
        conversationId: { type: string }
        userId: { type: string }
        role: { type: string }
        scope: { type: string, enum: [org, quote, workspace] }
        quoteId: { type: string, nullable: true }
        workspaceId: { type: string, nullable: true }
        question: { type: string }
        text: { type: string, description: 'Answer with inline refs ([S1], [C2], [M1]).' }
        notFound: { type: boolean }
        citations: { type: array, items: { $ref: '#/components/schemas/ChatCitation' } }
        toolTrace: { type: array, items: { $ref: '#/components/schemas/ChatToolCall' } }
        usage: { $ref: '#/components/schemas/ChatTurnUsage' }
        at: { type: string, format: date-time }
        invalidCitations: { type: array, items: { type: string }, nullable: true, description: Refs the model wrote that no tool returned this turn (dropped). }
        capNote: { type: string, nullable: true, description: 'Set when a per-turn cap (6 tool calls, 12 document chunks) stopped a tool.' }
        unverified: { type: array, items: { type: string }, nullable: true, description: 'Brief 24 step 5: names, dates or quotations in the answer that no tool returned this turn (fact guard); also a "fact-guard" entry in toolTrace.' }
    ChatConversation:
      type: object
      required: [conversationId, turns]
      properties:
        conversationId: { type: string }
        turns: { type: array, items: { $ref: '#/components/schemas/ChatTurnResult' } }
    WorkspaceRequest:
      type: object
      properties:
        name: { type: string, nullable: true, maxLength: 200 }
    ChatWorkspace:
      type: object
      required: [workspaceId, ownerUserId, createdAt, expiresAt]
      properties:
        workspaceId: { type: string }
        ownerUserId: { type: string }
        name: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
    ReopenRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    OverrideRequest:
      type: object
      required: [overrides, rationale]
      properties:
        overrides: { type: array, items: { $ref: '#/components/schemas/FieldOverride' } }
        rationale: { type: string }
    OverrideResult:
      type: object
      required: [documentId, revision, changed, hardFailures, attempts, at]
      properties:
        documentId: { type: string }
        revision: { type: integer }
        changed: { type: integer }
        hardFailures: { type: integer }
        attempts: { type: integer, description: 1 unless a concurrent decision took the revision first. }
        at: { type: string, format: date-time }
    AnnotationRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 4000 }
        claimIds: { type: array, items: { type: string }, nullable: true }
        category: { type: string, nullable: true }
    Annotation:
      type: object
      required: [id, quoteId, text, claimIds, createdBy, createdAt, outboxId]
      properties:
        id: { type: string }
        quoteId: { type: string }
        text: { type: string }
        claimIds: { type: array, items: { type: string } }
        category: { type: string, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        outboxId: { type: string, description: The Service Bus MessageId and the Idempotency-Key the quote system receives. }
    OutboxEntry:
      type: object
      required: [id, channel, kind, payload, createdAt, createdBy, publishAttempts]
      properties:
        id: { type: string }
        channel: { type: string, enum: [command, event] }
        kind: { type: string, enum: [quote.flags, quote.annotation, quote.followup, quote.memo-link, quote.payload, upload.completed, review.decided, format.learned] }
        quoteId: { type: string, nullable: true }
        subject: { type: string, nullable: true }
        payload: { type: object }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        publishedAt: { type: string, format: date-time, nullable: true }
        publishAttempts: { type: integer }
        lastError: { type: string, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        deliveryStatus: { type: string, enum: [delivered, replayed, superseded, rejected], nullable: true, description: 'superseded: 409 stale-revision, the quote system holds a newer quoteRevision (ADR 0024); completed, not retried or dead-lettered.' }
        delivery: { type: object, nullable: true, description: The quote system's status and body. }
